name: Strict outage CORS origin gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  origin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Exercise hostile CORS origins
        run: python3 -m unittest discover -s tests -p 'test_cors_origin.py' -v
