name: Internal diagnostics infrastructure

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify runner tools
        run: |
          command -v python3
          command -v kubectl

      - name: Validate overlays and outage-spool policy
        run: python3 scripts/validate-internal-diagnostics.py
