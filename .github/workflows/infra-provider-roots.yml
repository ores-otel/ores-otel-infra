name: Infra provider roots
on:
  pull_request:
    paths: ["neon/**", "supabase/**", "cloudflare/**", "aws/**", "gcp/**", "tf/**", "contracts/infra-gitops/**", "scripts/validate-infra-provider-roots.sh", ".github/workflows/infra-provider-roots.yml"]
  push:
    branches: [main]
    paths: ["neon/**", "supabase/**", "cloudflare/**", "aws/**", "gcp/**", "tf/**", "contracts/infra-gitops/**", "scripts/validate-infra-provider-roots.sh", ".github/workflows/infra-provider-roots.yml"]
  workflow_dispatch:
    inputs:
      ores_cli_ref:
        description: Immutable ORESoftware/ores-cli ref to verify
        required: true
        default: feab8fc32e7fb2828e208ed4430d584b4adc59d6
        type: string
permissions:
  contents: read
jobs:
  validate-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate six real provider roots and external-secret markers
        run: ./scripts/validate-infra-provider-roots.sh --structural-only
      - name: Set up tested Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
      - name: TJSV peer-authority parity
        uses: ORESoftware/typespec-json-schema-validator@eac61635922c244c7a37829c63d0966de44ff800
        with:
          typespec: contracts/infra-gitops/main.tsp
          schema: contracts/infra-gitops/authored.schema.json
          report: .typespec-json-schema-validator/report.json
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          output_dir: .typespec-json-schema-validator/generated
          max_probes: "64"
      - name: Keep authored authorities immutable during comparison
        if: ${{ always() }}
        run: git diff --exit-code -- contracts/infra-gitops/

  private-cli:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-public
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ORES_CLI_READ_TOKEN: ${{ secrets.ORES_CLI_READ_TOKEN }}
    steps:
      - name: Require approved private-source credential
        run: |
          set -euo pipefail
          test -n "${ORES_CLI_READ_TOKEN:-}" || {
            echo 'ORES_CLI_READ_TOKEN is required for private oresc verification' >&2
            exit 2
          }
      - name: Check out exact infra revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out reviewed private ores-cli source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-cli
          ref: ${{ inputs.ores_cli_ref }}
          token: ${{ secrets.ORES_CLI_READ_TOKEN }}
          path: .private-tools/ores-cli
          persist-credentials: false
      - name: Build exact private CLI and verify required paths
        shell: bash
        run: |
          set -euo pipefail
          CLI_DIR="$GITHUB_WORKSPACE/.private-tools/ores-cli"
          git config --global url."https://x-access-token:${ORES_CLI_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          trap 'git config --global --unset-all url.https://x-access-token:${ORES_CLI_READ_TOKEN}@github.com/.insteadOf || true' EXIT
          (cd "$CLI_DIR" && cargo build --locked --release --bins)
          export PATH="$CLI_DIR/target/release:$PATH"
          export FLAGS2ENV_CONFIG="$CLI_DIR/.cli-flags.toml"
          ./scripts/validate-infra-provider-roots.sh
          git diff --exit-code HEAD -- . ':(exclude).private-tools/**'
