name: Infra provider roots
on:
  pull_request:
    paths: ["neon/**", "supabase/**", "cloudflare/**", "aws/**", "gcp/**", "tf/**", "contracts/infra-gitops/**", "scripts/validate-infra-provider-roots.sh", ".github/workflows/infra-provider-roots.yml"]
  push:
    branches: [main]
    paths: ["neon/**", "supabase/**", "cloudflare/**", "aws/**", "gcp/**", "tf/**", "contracts/infra-gitops/**", "scripts/validate-infra-provider-roots.sh", ".github/workflows/infra-provider-roots.yml"]
  workflow_dispatch:
permissions:
  contents: read
env:
  ZED_CLI_REV: a1c5b7a3c72b957944b76911fcbc723dd9c16541
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install ores-cli through pinned Zed
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/zed-pkg/zed-cli.git "$RUNNER_TEMP/zed-cli"
          git -C "$RUNNER_TEMP/zed-cli" checkout --detach "$ZED_CLI_REV"
          (cd "$RUNNER_TEMP/zed-cli" && cargo build --locked --release --bin zed)
          ZED="$RUNNER_TEMP/zed-cli/target/release/zed"
          TOOL_WS="$RUNNER_TEMP/ores-cli-smoke"
          mkdir -p "$TOOL_WS"
          installed=false
          for attempt in 1 2 3; do
            if (cd "$TOOL_WS" && "$ZED" install oresoftware/ores-cli@=0.1.0 --allow-build --adapter none); then
              installed=true
              break
            fi
            sleep $((attempt * 5))
          done
          test "$installed" = true
          echo "ZED_BIN=$ZED" >> "$GITHUB_ENV"
          echo "ORESC_TOOL_WORKSPACE=$TOOL_WS" >> "$GITHUB_ENV"
      - name: Validate six roots
        run: ./scripts/validate-infra-provider-roots.sh
      - name: Set up tested Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
      - name: TJSV peer-authority parity
        uses: ORESoftware/typespec-json-schema-validator@eac61635922c244c7a37829c63d0966de44ff800
        with:
          typespec: contracts/infra-gitops/main.tsp
          schema: contracts/infra-gitops/authored.schema.json
          report: .typespec-json-schema-validator/report.json
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          output_dir: .typespec-json-schema-validator/generated
          max_probes: "64"
      - name: Keep authored authorities immutable during comparison
        if: ${{ always() }}
        run: git diff --exit-code -- contracts/infra-gitops/
