apiVersion: v1
kind: ConfigMap
metadata:
  name: ores-otel-internal-diagnostics
  namespace: ores-otel
data:
  ORES_INTERNAL_DIAGNOSTICS_ENABLED: "true"
  ORES_INTERNAL_DIAGNOSTICS_PROVIDER: stderr
  ORES_INTERNAL_DIAGNOSTICS_STDERR_FALLBACK: "true"
  ORES_INTERNAL_DIAGNOSTICS_SCHEMA: ores.otel.log/internal-diagnostic/v1
